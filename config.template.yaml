proxies:
   - { name: 'BWG', type: ss, server: ${BWG_SERVER}, port: ${PORT}, cipher: aes-256-gcm, password: ${ALLPASS}, udp: true }
   - { name: 'KR', type: ss, server: ${KR_SERVER}, port: ${PORT}, cipher: aes-256-gcm, password: ${ALLPASS}, udp: true }
   - { name: 'snell-home', type: snell, server: ${SNELLSERVER}, port: ${SNELL_PORT}, psk: ${ALLPASS} }
   - { name: 'OVH', type: ss, server: ${OVH_SERVER}, port: ${PORT}, cipher: aes-256-gcm, password: ${ALLPASS}, udp: true }

proxy-groups:
  - { name: '自动选择快速节点', type: url-test, proxies: ['BWG', 'KR', 'OVH'], url: 'http://www.gstatic.com/generate_204', interval: 300 }
  - { name: 'PROXY', type: select, proxies: ['自动选择快速节点', 'BWG', 'OVH', 'KR'] }
  - { name: 'HOME', type: select, proxies: ['snell-home'] }
  - { name: 'USCARD', type: select, proxies: ['BWG', 'KR', 'OVH'] }

